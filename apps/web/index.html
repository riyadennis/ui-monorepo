<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Riya Dennis — backend systems engineer specialising in Go and Kubernetes." />
    <title>Riya Dennis</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; }
      a:hover { opacity: 0.85; }
      .prose { line-height: 1.75; color: #2a2a2a; }
      .prose h1 { font-size: 2rem; }
      .prose h2 { font-size: 1.4rem; margin-top: 2rem; }
      .prose h3 { font-size: 1.15rem; margin-top: 1.5rem; }
      .prose p, .prose li { font-size: 1.02rem; }
      .prose ul { padding-left: 1.3rem; }
      .prose li { margin: 0.3rem 0; }
      .prose blockquote {
        margin: 1.2rem 0;
        padding: 0.4rem 1rem;
        border-left: 3px solid #646cff;
        color: #555;
        font-style: italic;
      }
      .prose code {
        background: #f4f4f5;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .prose pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      .prose pre code { background: none; padding: 0; }
      .prose a { color: #646cff; }
      .prose img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 1.5rem auto;
        border: 1px solid #eee;
        border-radius: 8px;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
