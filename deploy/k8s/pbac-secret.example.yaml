# Copy to pbac-secret.yaml, fill in the real RDS connection string, and apply.
# DO NOT commit the filled-in version (it is git-ignored below).
#
# RDS requires TLS, so keep sslmode=require.
#   postgres://<user>:<password>@<rds-endpoint>:5432/pbac?sslmode=require
apiVersion: v1
kind: Secret
metadata:
  name: pbac-secrets
  namespace: riyadennis
type: Opaque
stringData:
  DATABASE_URL: "postgres://pbac:CHANGE_ME@your-db.xxxxxxxx.eu-west-1.rds.amazonaws.com:5432/pbac?sslmode=require"
