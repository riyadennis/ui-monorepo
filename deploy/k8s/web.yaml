apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: riyadennis
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          # Public ECR image (built from apps/web/Dockerfile).
          # Public ECR is pulled anonymously — no imagePullSecret needed.
          image: public.ecr.aws/riyadennis/ui-monorepo:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: riyadennis
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
