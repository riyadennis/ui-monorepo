name: Build and push web image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC auth to AWS
  contents: read

env:
  IMAGE: public.ecr.aws/riyadennis/ui-monorepo
  AWS_REGION: us-east-1 # Public ECR's API lives only in us-east-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # TEMP diagnostic: print the OIDC token's sub/aud so we can compare them to
      # the IAM role's trust conditions. Remove once auth works.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("sub:",c.get("sub")); print("aud:",c.get("aud")); print("repository:",c.get("repository")); print("repository_owner:",c.get("repository_owner"))' "$TOKEN"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # This role must trust GitHub's OIDC provider (see the IAM setup below).
          role-to-assume: arn:aws:iam::328411615730:role/github-actions-ecr

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
